name: SpatialRehab
options:
  bundleIdPrefix: com.spatialrehab
  deploymentTarget:
    visionOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "7"
    ENABLE_PREVIEWS: YES
schemes:
  SpatialRehab:
    build:
      targets:
        SpatialRehab: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  SpatialRehab:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: SpatialRehab
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spatialrehab.SpatialRehab
        PRODUCT_NAME: SpatialRehab
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SpatialRehab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBALACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: SpatialRehab/Info.plist
      properties:
        CFBundleDisplayName: SpatialRehab
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSHandsTrackingUsageDescription: SpatialRehab uses hand tracking so you can walk and turn in the first-person Yishun practice walk with pinch gestures.
